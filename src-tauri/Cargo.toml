[package]
name = "folio"
version = "0.4.0"
description = "A light, fast Markdown viewer and editor"
authors = ["nikfero"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "folio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
base64 = "0.22"
trash = "5"
regex = "1"

# Only to switch off WebView2's browser shortcuts (F12, Ctrl+F, F5, Alt+Left…),
# which Tauri doesn't expose; same versions Tauri already uses.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
