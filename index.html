<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Folio</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header id="topbar">
      <div id="tabs" role="tablist" aria-label="Open documents"></div>
      <button id="btn-new-tab" class="icon-btn" aria-label="New tab"></button>
      <div class="topbar-spacer"></div>
      <div id="modes" class="segmented" role="group" aria-label="View mode">
        <button data-mode="read" title="Read">Read</button>
        <button data-mode="live" title="Live preview: formatting shown in place while you edit">Live</button>
        <button data-mode="split" title="Split">Split</button>
        <button data-mode="edit" title="Edit">Edit</button>
      </div>
      <button id="btn-toc" class="icon-btn" aria-label="Toggle outline"></button>
      <button id="btn-theme" class="icon-btn" aria-label="Change theme"></button>
      <button id="btn-menu" class="icon-btn" aria-label="Menu" title="Menu"></button>
    </header>

    <div id="banner" role="status" hidden></div>

    <main id="workspace" data-mode="none">
      <aside id="toc">
        <div class="sidebar-tabs" role="tablist">
          <button data-panel="files" role="tab">Files</button>
          <button data-panel="search" role="tab">Search</button>
          <button data-panel="outline" role="tab">Outline</button>
        </div>
        <div id="files-panel" class="sidebar-panel"></div>
        <div id="search-panel" class="sidebar-panel"></div>
        <nav id="toc-list" class="sidebar-panel"></nav>
      </aside>
      <div id="sidebar-resizer" title="Drag to resize, double-click to reset"></div>
      <section id="editor-pane" aria-label="Editor"></section>
      <div id="divider" role="separator" aria-orientation="vertical" title="Drag to resize, double-click to reset"></div>
      <section id="preview-pane" aria-label="Preview" tabindex="-1">
        <article class="markdown-body"></article>
      </section>

      <section id="welcome">
        <div class="welcome-inner">
          <div class="welcome-logo">
            <img src="/folio.svg" alt="" width="64" height="64" />
            <h1>Folio</h1>
            <p>A light Markdown viewer and editor</p>
          </div>
          <div class="welcome-actions">
            <button id="welcome-open" class="btn primary">Open File…</button>
            <button id="welcome-folder" class="btn">Open Folder…</button>
            <button id="welcome-new" class="btn">New File</button>
          </div>
          <div id="recent" hidden>
            <h2>Recent</h2>
            <div id="recent-list"></div>
          </div>
          <dl class="welcome-keys">
            <dt><kbd class="kbd-mod">Ctrl</kbd> <kbd>O</kbd></dt><dd>Open</dd>
            <dt><kbd class="kbd-mod">Ctrl</kbd> <kbd>P</kbd></dt><dd>Go to file</dd>
            <dt><kbd class="kbd-mod">Ctrl</kbd> <kbd>Shift</kbd> <kbd>P</kbd></dt><dd>All commands</dd>
            <dt><kbd class="kbd-mod">Ctrl</kbd> <kbd>E</kbd></dt><dd>Read / Split / Edit</dd>
            <dt><kbd class="kbd-mod">Ctrl</kbd> <kbd>F</kbd></dt><dd>Find</dd>
            <dt><kbd class="kbd-mod">Ctrl</kbd> + click</dt><dd>Jump from preview to source</dd>
          </dl>
          <p class="welcome-hint">…or drop Markdown files or a folder anywhere in this window.</p>
        </div>
      </section>
    </main>

    <footer id="statusbar" hidden>
      <span id="st-path"></span>
      <span id="st-flash"></span>
      <span class="topbar-spacer"></span>
      <span id="st-pos"></span>
      <span id="st-words"></span>
      <button id="st-reload" class="status-toggle"></button>
      <span id="st-eol"></span>
    </footer>

    <div id="drop-overlay" hidden><div>Drop to open</div></div>
    <div id="focus-bar" role="toolbar" aria-label="Focus mode">
      <span id="focus-words"></span>
      <button data-focus="highlight" title="What stays bright while you write">Highlight: <span></span></button>
      <button data-focus="typewriter" title="Keep the line you're writing in the middle of the screen">Typewriter</button>
      <button data-focus="exit" title="Leave focus mode">Exit <kbd>Esc</kbd></button>
    </div>
  </body>
</html>
